services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      ENV: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chatbot
      USE_REDIS_QUEUE: "1"
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  worker:
    build: .
    command: python worker.py
    env_file: .env
    environment:
      ENV: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chatbot
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  mcp:
    build: .
    command: python -m mcp_server --transport streamable-http --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      ENV: production
      MCP_TRANSPORT: streamable-http
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  pg_data:
