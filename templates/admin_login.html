<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppAssist Admin Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2rem; width: 100%; max-width: 400px; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { color: #94a3b8; font-size: 0.9rem; margin: 0 0 1.5rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; color: #cbd5e1; }
    input { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #f1f5f9; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; margin-top: 1rem; padding: 0.85rem; border: none; border-radius: 10px; background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer; font-size: 1rem; }
    button:hover { background: #16a34a; }
    .error { color: #f87171; font-size: 0.85rem; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AppAssist Admin</h1>
    <p>Enter your admin key from <code>.env</code> (<code>ADMIN_API_KEY</code>).</p>
    <form method="post">
      <label for="admin_key">Admin key</label>
      <input type="password" id="admin_key" name="admin_key" required autofocus placeholder="Your ADMIN_API_KEY">
      <button type="submit">Sign in</button>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
    </form>
  </div>
</body>
</html>
